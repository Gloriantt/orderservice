version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: orderservice_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: orderservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  orderservice:
    build: .
    container_name: orderservice_app
    depends_on:
      - postgres
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderservice
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      USER_SERVICE_URL: http://authenticationservice:8081
    restart: always

  authenticationservice:
    image: your-auth-service-image
    container_name: authenticationservice
    ports:
      - "8081:8081"

volumes:
  postgres_data:
