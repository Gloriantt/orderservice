stages:
  - build
  - test
  - analyze
  - docker

variables:
  MAVEN_CLI_OPTS: "-B -e -ntp"
  DOCKER_DRIVER: overlay2

build-job:
  stage: build
  image: maven:3.9.8-eclipse-temurin-21
  script:
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar

test-job:
  stage: test
  image: maven:3.9.8-eclipse-temurin-21
  script:
    - mvn $MAVEN_CLI_OPTS test

sonarqube-check:
  stage: analyze
  image: maven:3.9.8-eclipse-temurin-21
  script:
    - mvn sonar:sonar
  only:
    - merge_requests
    - main
  allow_failure: true

docker-build:
  stage: docker
  image: docker:25.0.0
  services:
    - docker:25.0.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest